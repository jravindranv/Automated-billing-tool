<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sales History')}"></head>
<body>
<nav th:replace="~{fragments :: nav('invoices')}"></nav>
<main>
    <div class="page-head">
        <h1>Sales History</h1>
        <a class="btn" th:href="@{/billing/new}">+ New Bill</a>
    </div>
    <div th:replace="~{fragments :: flash}"></div>
    <div class="card">
        <form class="inline-form" method="get" th:action="@{/invoices}" style="margin-bottom:12px">
            <input type="text" name="q" th:value="${q}" placeholder="Invoice no., customer or phone">
            <button class="btn secondary" type="submit">Search</button>
        </form>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Invoice</th><th>Date</th><th>Customer</th><th class="num">Total</th><th class="num">Paid</th><th>Status</th></tr>
                </thead>
                <tbody>
                <tr th:each="i : ${invoices}">
                    <td><a th:href="@{/invoices/{id}(id=${i.id})}" th:text="${i.invoiceNumber}"></a></td>
                    <td th:text="${#temporals.format(i.invoiceDate, 'dd-MMM-yyyy HH:mm')}"></td>
                    <td th:text="${i.customerName}"></td>
                    <td class="num" th:text="${#numbers.formatDecimal(i.grandTotal, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td class="num" th:text="${#numbers.formatDecimal(i.amountPaid, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td><span class="badge" th:classappend="${i.paymentStatus}" th:text="${i.paymentStatus}"></span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(invoices)}"><td colspan="6" class="muted">No invoices found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
