<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Customers')}"></head>
<body>
<nav th:replace="~{fragments :: nav('customers')}"></nav>
<main>
    <div class="page-head">
        <h1>Customers</h1>
        <a class="btn" th:href="@{/customers/new}">+ Add Customer</a>
    </div>
    <div th:replace="~{fragments :: flash}"></div>
    <div class="card">
        <form class="inline-form" method="get" th:action="@{/customers}" style="margin-bottom:12px">
            <input type="text" name="q" th:value="${q}" placeholder="Search name or phone">
            <button class="btn secondary" type="submit">Search</button>
        </form>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>State</th><th>GSTIN</th><th></th></tr></thead>
                <tbody>
                <tr th:each="c : ${customers}">
                    <td th:text="${c.name}"></td>
                    <td th:text="${c.phone}"></td>
                    <td th:text="${c.email}"></td>
                    <td th:text="${c.state}"></td>
                    <td th:text="${c.gstin}"></td>
                    <td class="num">
                        <a class="btn small secondary" th:href="@{/customers/{id}/edit(id=${c.id})}">Edit</a>
                        <form style="display:inline" method="post" th:action="@{/customers/{id}/delete(id=${c.id})}"
                              onsubmit="return confirm('Delete this customer?')">
                            <button class="btn small danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(customers)}"><td colspan="6" class="muted">No customers found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
