<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Products')}"></head>
<body>
<nav th:replace="~{fragments :: nav('products')}"></nav>
<main>
    <div class="page-head">
        <h1>Products &amp; Inventory</h1>
        <a class="btn" th:href="@{/products/new}">+ Add Product</a>
    </div>
    <div th:replace="~{fragments :: flash}"></div>
    <div class="card">
        <form class="inline-form" method="get" th:action="@{/products}" style="margin-bottom:12px">
            <input type="text" name="q" th:value="${q}" placeholder="Search name or SKU">
            <button class="btn secondary" type="submit">Search</button>
        </form>
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Name</th><th>SKU</th><th>HSN</th><th class="num">Price (ex-GST)</th><th class="num">GST %</th><th class="num">Stock</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.sku}"></td>
                    <td th:text="${p.hsnCode}"></td>
                    <td class="num" th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td class="num" th:text="${p.gstRate}"></td>
                    <td class="num" th:classappend="${p.stock <= @shopProperties.lowStockThreshold} ? 'low'"
                        th:text="${p.stock} + ' ' + ${p.unit}"></td>
                    <td class="num">
                        <a class="btn small secondary" th:href="@{/products/{id}/edit(id=${p.id})}">Edit</a>
                        <form style="display:inline" method="post" th:action="@{/products/{id}/delete(id=${p.id})}"
                              onsubmit="return confirm('Delete this product?')">
                            <button class="btn small danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}"><td colspan="7" class="muted">No products found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
