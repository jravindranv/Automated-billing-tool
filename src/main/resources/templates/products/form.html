<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Product')}"></head>
<body>
<nav th:replace="~{fragments :: nav('products')}"></nav>
<main>
    <h1 th:text="${product.id == null} ? 'Add Product' : 'Edit Product'">Product</h1>
    <div class="card" style="max-width:640px">
        <form method="post" th:action="@{/products}" th:object="${product}">
            <input type="hidden" th:field="*{id}">
            <div class="field">
                <label for="name">Name *</label>
                <input id="name" type="text" th:field="*{name}">
                <div class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="row">
                <div class="field"><label for="sku">SKU / Code</label><input id="sku" type="text" th:field="*{sku}"></div>
                <div class="field"><label for="hsnCode">HSN / SAC code</label><input id="hsnCode" type="text" th:field="*{hsnCode}"></div>
            </div>
            <div class="row">
                <div class="field">
                    <label for="price">Price per unit (excl. GST) *</label>
                    <input id="price" type="number" step="0.01" min="0" th:field="*{price}">
                    <div class="error-text" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>
                <div class="field">
                    <label for="gstRate">GST rate % *</label>
                    <input id="gstRate" type="number" step="0.01" min="0" max="100" list="gstRates" th:field="*{gstRate}">
                    <datalist id="gstRates"><option value="0"></option><option value="5"></option><option value="12"></option><option value="18"></option><option value="28"></option></datalist>
                    <div class="error-text" th:if="${#fields.hasErrors('gstRate')}" th:errors="*{gstRate}"></div>
                </div>
            </div>
            <div class="row">
                <div class="field">
                    <label for="stock">Stock quantity</label>
                    <input id="stock" type="number" min="0" th:field="*{stock}">
                    <div class="error-text" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                </div>
                <div class="field"><label for="unit">Unit</label><input id="unit" type="text" th:field="*{unit}" placeholder="pcs, kg, ltr"></div>
            </div>
            <button class="btn" type="submit">Save</button>
            <a class="btn secondary" th:href="@{/products}">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
